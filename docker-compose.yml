version: '3.8'

services:
  # ---- MySQL 数据库 ----
  db:
    image: mysql:8.0
    container_name: warehouse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-warehouse_system}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- FastAPI 后端 ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warehouse-backend
    restart: unless-stopped
    ports:
      - "8300:8300"
    environment:
      - ENV=production
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root123456}@db:3306/${MYSQL_DATABASE:-warehouse_system}
      - API_TOKEN=${API_TOKEN:-warehouse-secret-token}
    depends_on:
      db:
        condition: service_healthy

  # ---- Vue 前端 (nginx) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: warehouse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
